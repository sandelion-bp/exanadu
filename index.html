<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exanadu — 이제너두 SB 저장소</title>
<style>
  :root {
    --ink: #1a1d23;
    --sub: #6b7280;
    --line: #e2e5ea;
    --bg: #f5f6f8;
    --card: #ffffff;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 28px 32px;
  }
  header h1 { margin: 0 0 6px; font-size: 20px; }
  header p { margin: 0; color: var(--sub); font-size: 13px; max-width: 640px; }

  main { max-width: 900px; margin: 0 auto; padding: 28px 32px 60px; }
  main h2 { font-size: 13px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }

  .project-list { display: flex; flex-direction: column; gap: 12px; }
  a.project-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.project-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-card .code { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: .02em; }
  .project-card .name { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .project-card .arrow { color: var(--accent); font-size: 18px; flex: 0 0 auto; }
</style>
</head>
<body>

<header>
  <h1>exanadu</h1>
  <p>프로젝트 리스트</p>
</header>

<main>
  <h2>프로젝트</h2>
  <div class="project-list">
    <a class="project-card" data-redmine="91888" href="./91888 기획전 쿠폰/index.html">
      <div>
        <div class="code">91888</div>
        <div class="name">기획전 전용 할인쿠폰</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</main>

<script>
  // ?redmine=91888 같은 쿼리로 들어오면 해당 프로젝트로 바로 이동한다.
  // 새 프로젝트 카드를 추가할 때 data-redmine 속성만 같이 넣으면 자동으로 동작한다(별도 목록 관리 불필요).
  (function () {
    var redmine = new URLSearchParams(location.search).get('redmine');
    if (!redmine) return;
    var card = document.querySelector('.project-card[data-redmine="' + redmine + '"]');
    if (card) location.replace(card.getAttribute('href'));
  })();
</script>

</body>
</html>
