<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>exanadu — 이제너두 SB 저장소</title>
<style>
  :root {
    --ink: #1a1d23;
    --sub: #6b7280;
    --line: #e2e5ea;
    --bg: #f5f6f8;
    --card: #ffffff;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 28px 32px;
  }
  header h1 { margin: 0 0 6px; font-size: 20px; }
  header p { margin: 0; color: var(--sub); font-size: 13px; max-width: 640px; }

  main { max-width: 900px; margin: 0 auto; padding: 28px 32px 60px; }
  main h2 { font-size: 13px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }

  .project-list { display: flex; flex-direction: column; gap: 12px; }
  a.project-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.project-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-card .code { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: .02em; }
  .project-card .name { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .project-card .arrow { color: var(--accent); font-size: 18px; flex: 0 0 auto; }
</style>
</head>
<body>

<header>
  <h1>exanadu</h1>
  <p>이제너두 관련 프로젝트의 SB(화면설계서)를 HTML로 구현해 프로젝트 단위로 관리하는 저장소. 프로젝트를 선택하면 해당 SB 문서(화면 목록)로 이동한다. 구성 원칙·공용 컴포넌트 사용법은 <a href="https://github.com/sandelion-bp/exanadu#readme" style="color:var(--accent)">README</a> 참고.</p>
</header>

<main>
  <h2>프로젝트</h2>
  <div class="project-list">
    <a class="project-card" href="./91888 기획전 쿠폰/index.html">
      <div>
        <div class="code">91888</div>
        <div class="name">기획전 전용 할인쿠폰</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</main>

</body>
</html>
